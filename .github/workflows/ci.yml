name: Supply Chain Sentinel CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ── Job 1: Unit tests (fast, no Docker required) ───────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies (mocked — no torch/GPU needed)
        run: |
          pip install --upgrade pip
          pip install \
            fastapi uvicorn httpx pytest pydantic \
            numpy redis requests websockets

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  # ── Job 2: Docker smoke test ────────────────────────────────────────────────
  docker-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run on pushes to the original repo to avoid secrets/permission issues on forks
    if: github.event_name == 'push' && github.repository == github.event.repository.full_name

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build all service images
        run: docker compose build --no-cache

      - name: Start infrastructure only (Redis + exporter)
        run: docker compose up -d redis redis_exporter

      - name: Wait for Redis to be healthy
        run: |
          for i in {1..20}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' sentinel_redis 2>/dev/null || echo "not_found")
            echo "Redis status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "Redis failed to become healthy"
          docker logs sentinel_redis
          exit 1

      - name: Start ML Engine
        run: docker compose up -d ml_engine

      - name: Wait for ML Engine health (allows time for auto-training)
        run: |
          for i in {1..40}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' sentinel_ml_engine 2>/dev/null || echo "starting")
            echo "ML Engine status: $STATUS  (attempt $i/40)"
            if [ "$STATUS" = "healthy" ]; then
              echo "ML Engine is healthy"
              exit 0
            fi
            sleep 15
          done
          echo "ML Engine failed to become healthy"
          docker logs sentinel_ml_engine
          exit 1

      - name: Smoke test ML Engine health endpoint
        run: curl --fail http://localhost:5000/health

      - name: Smoke test ML Engine predict endpoint
        run: |
          curl --fail -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"series": [[1.0, 2.0, 3.0], [1.1, 2.1, 3.1], [0.9, 1.9, 2.9]]}'

      - name: Shutdown
        if: always()
        run: docker compose down
