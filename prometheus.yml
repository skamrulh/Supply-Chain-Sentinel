global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-scrape — must use container name, not localhost
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # ML Engine custom metrics (sentinel_* metrics from predictor.py)
  - job_name: 'ml_engine'
    metrics_path: /metrics
    static_configs:
      - targets: ['ml_engine:8001']

  # Redis Exporter — standard redis metrics (stream lengths, memory, etc.)
  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis_exporter:9121']

  # NOTE: api_gateway:8002 and ingestion:8003 targets removed.
  # Neither service exposes a /metrics endpoint.
  # To add Prometheus metrics to those services, install prometheus-client
  # and call start_http_server() or mount a /metrics FastAPI route.
